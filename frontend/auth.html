<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tender – Continue Watching</title>
<style>
  :root {
    --bg:#0a0a0a; --card:#131313; --border:#262626;
    --input:#0f0f0f; --input-border:#2e2e2e;
    --text:#ffffff; --muted:#8a8a8a;
    --red:#f6121d; --red-hover:#ff1f2b; --red-link:#ff2a35;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
  body { min-height:100vh; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:560px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:44px 40px; }
  .lock { font-size:44px; text-align:center; display:block; margin-bottom:12px; }
  h1 { font-size:26px; font-weight:700; text-align:center; margin-bottom:26px; letter-spacing:.2px; }
  .infobox { background:var(--input); border:1px solid var(--input-border); border-radius:8px; padding:16px 18px; font-size:15px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:12px; }
  .infobox .dot { width:10px; height:10px; border-radius:50%; background:var(--red); flex-shrink:0; }
  .cta { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; height:56px; margin-top:6px; background:var(--red); border:none; border-radius:8px; color:#fff; font-size:16px; font-weight:700; cursor:pointer; transition:.15s; }
  .cta:hover { background:var(--red-hover); }
  .cta svg { width:20px; height:20px; }
  .prov { display:flex; align-items:center; gap:14px; width:100%; height:56px; padding:0 18px; margin-bottom:14px; background:var(--input); border:1px solid var(--input-border); border-radius:8px; color:var(--text); font-size:15px; font-weight:600; text-decoration:none; cursor:pointer; transition:.15s; }
  .prov:hover { background:#1a1a1a; border-color:#4a4a4a; }
  .prov svg { width:20px; height:20px; flex-shrink:0; }
  .prov.soon { opacity:.4; cursor:not-allowed; }
  .prov .badge { margin-left:auto; font-size:11px; font-weight:500; color:var(--muted); border:1px solid var(--input-border); border-radius:12px; padding:3px 10px; }
  .foot { text-align:center; color:var(--muted); font-size:13px; margin-top:22px; line-height:2; }
  .foot a { color:var(--red-link); text-decoration:none; }
  .foot a:hover { text-decoration:underline; }
  @media (max-width:480px) { .card { padding:36px 22px; } h1 { font-size:22px; } }
</style>
</head>
<body>
<main class="card">
  <span class="lock">&#128274;</span>
  <h1>Continue Watching</h1>

  <div class="infobox"><span class="dot"></span><span>Sign in to pick up where you left off</span></div>

  <button class="cta" id="btnGoogle" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffffff" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/></svg>
    <span>Continue with Google</span>
  </button>

  <div class="prov soon" style="margin-top:14px;" aria-disabled="true">
    <svg viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true"><path d="M17.05 12.54c-.03-2.89 2.36-4.27 2.47-4.34-1.35-1.97-3.44-2.24-4.18-2.27-1.78-.18-3.47 1.05-4.37 1.05-.9 0-2.29-1.02-3.77-1-1.94.03-3.73 1.13-4.73 2.86-2.02 3.5-.52 8.68 1.45 11.52.96 1.39 2.1 2.95 3.6 2.89 1.45-.06 2-.93 3.75-.93s2.24.93 3.77.9c1.56-.03 2.55-1.41 3.5-2.8 1.1-1.61 1.55-3.17 1.58-3.25-.04-.02-3.03-1.16-3.07-4.63zM14.16 4.06c.8-.97 1.34-2.32 1.19-3.66-1.15.05-2.55.77-3.38 1.74-.74.86-1.39 2.23-1.22 3.55 1.29.1 2.6-.65 3.41-1.63z"/></svg>
    Continue with Apple <span class="badge">soon</span>
  </div>
  <div class="prov soon" aria-disabled="true">
    <svg viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07z"/></svg>
    Continue with Facebook <span class="badge">soon</span>
  </div>

  <p class="foot">
    Secured by Tender &middot; Google sign-in only (for now)<br>
    By continuing you agree to our <a href="/terms">Terms</a> &amp; <a href="/privacy">Privacy Policy</a>
  </p>
</main>

<script>
  document.getElementById('btnGoogle').addEventListener('click', () => {
    window.open('/google-auth.html', '_blank', 'noopener,noreferrer,width=460,height=760');
  });
</script>
</body>
</html>
