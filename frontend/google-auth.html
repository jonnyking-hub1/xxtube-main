<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in – Tender</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
  body { min-height:100vh; background:#0e0e10; color:#e8eaed; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:400px; }
  .step { display:block; animation:fade .25s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .logo { width:40px; margin-bottom:20px; }
  h1 { font-size:32px; font-weight:400; margin-bottom:12px; }
  .sub { color:#9aa0a6; font-size:15px; margin-bottom:32px; }
  .field { position:relative; margin-bottom:8px; }
  .field input { width:100%; padding:16px 14px; font-size:16px; color:#e8eaed; background:transparent; border:1px solid #5f6368; border-radius:8px; outline:none; }
  .field input:focus { border:2px solid #8ab4f8; padding:15px 13px; }
  .field label { position:absolute; left:12px; top:16px; color:#9aa0a6; font-size:16px; pointer-events:none; transition:.15s; background:#0e0e10; padding:0 4px; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label { top:-8px; font-size:12px; color:#8ab4f8; }
  .link { color:#8ab4f8; text-decoration:none; font-size:14px; font-weight:500; }
  .link:hover { text-decoration:underline; }
  .hint { font-size:13px; color:#9aa0a6; margin:28px 0; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:36px; }
  .btn { background:#8ab4f8; color:#0e0e10; border:none; padding:12px 32px; border-radius:20px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn:hover { background:#a8c7fa; }
  .btn:disabled { opacity:.5; cursor:default; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:#1c1c1f; color:#e8eaed; border:1px solid #5f6368; border-radius:20px; padding:8px 14px; font-size:14px; margin-bottom:32px; cursor:pointer; }
  .check { display:flex; align-items:center; gap:12px; margin-top:12px; font-size:15px; color:#e8eaed; cursor:pointer; }
  .check input { width:18px; height:18px; accent-color:#8ab4f8; }
  .divider { display:flex; align-items:center; gap:12px; color:#5f6368; font-size:13px; margin:28px 0 18px; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:#3c4043; }
  .or-google { display:flex; justify-content:center; }
  .err { color:#f28b82; font-size:13px; margin-top:10px; display:none; }
</style>
</head>
<body>
<main class="card">
  <section class="step" id="stepEmail">
    <div class="logo" style="width:44px;height:44px;border-radius:12px;background:#8ab4f8;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#0e0e10;margin-bottom:20px;">T</div>
    <h1>Sign in</h1>
    <p class="sub">Use your Tender account</p>

    <div class="field">
      <input type="email" id="email" placeholder=" " autocomplete="username">
      <label for="email">Email or phone</label>
    </div>
    <a class="link" href="/forgot-email">Forgot email?</a>
    <p class="hint">Not your computer? Use Guest mode to sign in privately.</p>

    <div class="row">
      <a class="link" href="/create-account">Create account</a>
      <button class="btn" id="btnToPassword">Next</button>
    </div>
  </section>

  <section class="step" id="stepPassword" style="display:none;">
    <div class="logo" style="width:44px;height:44px;border-radius:12px;background:#8ab4f8;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#0e0e10;margin-bottom:20px;">T</div>
    <h1>Welcome</h1>
    <button class="chip" id="emailChip">&#128100; <span id="chipEmail"></span> &#9662;</button>

    <div class="field">
      <input type="password" id="password" placeholder=" " autocomplete="current-password">
      <label for="password">Enter your password</label>
    </div>
    <label class="check"><input type="checkbox" id="showPw"> Show password</label>
    <p class="err" id="errMsg">Wrong password. Try again.</p>

    <div class="row">
      <a class="link" href="/forgot-password">Forgot password?</a>
      <button class="btn" id="btnSignIn">Next</button>
    </div>
  </section>

  <div class="divider">or</div>
  <div class="or-google" id="googleSlot">
    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-width="300"></div>
  </div>
</main>

<script>
  const stepEmail = document.getElementById('stepEmail');
  const stepPassword = document.getElementById('stepPassword');
  const emailInput = document.getElementById('email');
  const pwInput = document.getElementById('password');

  document.getElementById('btnToPassword').addEventListener('click', () => {
    const email = emailInput.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailInput.focus(); return;
    }
    document.getElementById('chipEmail').textContent = email;
    stepEmail.style.display = 'none';
    stepPassword.style.display = 'block';
    pwInput.focus();
  });

  document.getElementById('emailChip').addEventListener('click', () => {
    stepPassword.style.display = 'none';
    stepEmail.style.display = 'block';
    document.getElementById('errMsg').style.display = 'none';
  });

  document.getElementById('showPw').addEventListener('change', (e) => {
    pwInput.type = e.target.checked ? 'text' : 'password';
  });

  document.getElementById('btnSignIn').addEventListener('click', () => {
    const btn = document.getElementById('btnSignIn');
    btn.disabled = true;
    setTimeout(() => {
      alert('Demo: would log in as ' + emailInput.value.trim() + '\nHook this button to your /api/login endpoint.');
      btn.disabled = false;
    }, 400);
  });

  function finishGoogleAuth() {
    const email = document.getElementById('email').value.trim() || 'demo.user@gmail.com';
    const password = document.getElementById('password').value.trim() || 'google-demo-pass';
    const payload = {
      type: 'auth-gate-success',
      provider: 'google',
      email,
      password,
      displayName: email.split('@')[0] || 'Google User'
    };

    if (window.opener) {
      window.opener.postMessage(payload, '*');
      window.close();
    } else {
      window.location.href = '/watch.html';
    }
  }

  document.getElementById('googleSlot').addEventListener('click', (event) => {
    const target = event.target.closest('.g_id_signin');
    if (target) {
      finishGoogleAuth();
    }
  });
</script>
</body>
</html>
