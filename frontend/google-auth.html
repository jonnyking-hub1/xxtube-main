<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Mia Colby</title>
<link rel="icon" type="image/png" href="../assets/mia-colby-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .auth-box { background: #fff; border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .auth-logo { text-align: center; margin-bottom: 30px; }
  .auth-logo img { height: 40px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; color: #1a1a1a; }
  .auth-subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
  .form-group { margin-bottom: 20px; }
  .form-label { display: block; font-size: 14px; font-weight: 500; color: #333; margin-bottom: 8px; }
  .form-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color 0.2s; }
  .form-input:focus { outline: none; border-color: #ff0066; }
  .auth-btn { width: 100%; padding: 12px; background: #ff0066; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .auth-btn:hover { background: #e6005c; }
  .auth-btn:disabled { background: #ccc; cursor: not-allowed; }
  .auth-error { color: #f87171; font-size: 13px; margin-bottom: 20px; text-align: center; display: none; }
  .auth-success { color: #4ade80; font-size: 13px; margin-bottom: 20px; text-align: center; display: none; }
  .auth-footer { text-align: center; color: #999; font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>

<div class="auth-box">
  <div class="auth-logo">
    <img src="../assets/mia-colby-logo.png" alt="Mia Colby">
  </div>
  <h1>Sign In</h1>
  <p class="auth-subtitle">Enter your email and password to continue</p>
  
  <div class="auth-error" id="authError"></div>
  <div class="auth-success" id="authSuccess">Success! Closing in 2 seconds...</div>
  
  <form id="authForm">
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input class="form-input" type="email" id="authEmail" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="authPassword" placeholder="••••••••" required>
    </div>
    <button class="auth-btn" id="authSubmitBtn" type="button">Continue</button>
  </form>
  
  <p class="auth-footer">Demo sign-in • No real credentials required • Demo mode enabled</p>
</div>

<script>
  const form = document.getElementById('authForm');
  const emailInput = document.getElementById('authEmail');
  const passwordInput = document.getElementById('authPassword');
  const submitBtn = document.getElementById('authSubmitBtn');
  const errorEl = document.getElementById('authError');
  const successEl = document.getElementById('authSuccess');

  submitBtn.addEventListener('click', async (e) => {
    e.preventDefault();
    
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    
    if (!email || !password) {
      errorEl.textContent = 'Please enter both email and password.';
      errorEl.style.display = 'block';
      return;
    }
    
    if (!email.includes('@')) {
      errorEl.textContent = 'Please enter a valid email address.';
      errorEl.style.display = 'block';
      return;
    }
    
    errorEl.style.display = 'none';
    submitBtn.disabled = true;
    
    try {
      // Demo mode: accept any valid email/password
      successEl.style.display = 'block';
      
      // Send auth data back to parent window
      const authData = {
        type: 'auth-gate-success',
        email: email,
        password: password,
        provider: 'google'
      };
      
      // Store in sessionStorage so parent can retrieve it
      sessionStorage.setItem('xxtube-auth-data', JSON.stringify(authData));
      
      // Notify parent window
      if (window.opener) {
        window.opener.postMessage(authData, window.location.origin);
      }
      
      // Close after 2 seconds
      setTimeout(() => {
        window.close();
      }, 2000);
      
    } catch (err) {
      console.error('Auth error:', err);
      errorEl.textContent = 'Sign-in failed. Please try again.';
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
    }
  });
  
  // Allow Enter key to submit
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitBtn.click();
  });
</script>

</body>
</html>
