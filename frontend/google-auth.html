<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Sign-In</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #120c16;
        color: white;
        font-family: Arial, sans-serif;
      }
      .card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 18px;
        padding: 28px 24px;
        width: min(360px, 80vw);
        text-align: center;
      }
      h2 { margin: 0 0 12px; }
      p { color: #d9c8d6; margin-bottom: 20px; }
      button {
        background: #1a73e8;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Continue with Google</h2>
      <p>Signing in…</p>
      <button type="button" id="demoAuthBtn">Continue</button>
    </div>

    <script>
      const authData = {
        type: 'auth-gate-success',
        email: 'google.user@gmail.com',
        password: 'google-demo-pass',
        provider: 'google'
      };

      const sendAuth = () => {
        try {
          if (window.opener) {
            window.opener.postMessage(authData, '*');
          }
          sessionStorage.setItem('xxtube-auth-data', JSON.stringify(authData));
        } catch (e) {
          console.warn('Google auth fallback failed:', e);
        }

        setTimeout(() => window.close(), 600);
      };

      document.getElementById('demoAuthBtn').addEventListener('click', sendAuth);
      sendAuth();
    </script>
  </body>
</html>
